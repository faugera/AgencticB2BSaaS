name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Documentation checks
        run: pnpm docs:test && pnpm docs:check
      - name: Type checking
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: API smoke
        run: pnpm smoke
      - name: Browser setup
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: PostgreSQL development config
        env:
          POSTGRES_PASSWORD: ci-ephemeral-password
        run: |
          docker compose config --quiet
          docker compose up -d --wait postgres mailpit
          docker compose exec -T postgres psql -U enterprise -d enterprise_ai_os -c 'SELECT 1'
          docker compose exec -T postgres createdb -U enterprise enterprise_auth_test_ci
          docker compose exec -T postgres createdb -U enterprise enterprise_auth_test_b2b_migration
      - name: Historical migration preservation and replay
        env:
          AUTH_TEST_MIGRATION_PRESERVATION: "true"
          AUTH_TEST_DATABASE_URL: postgres://identity_runtime:ci-auth-runtime@127.0.0.1:5432/enterprise_auth_test_b2b_migration
          AUTH_TEST_MIGRATION_DATABASE_URL: postgres://enterprise:ci-ephemeral-password@127.0.0.1:5432/enterprise_auth_test_b2b_migration
        run: pnpm exec vitest run --config vitest.auth.config.ts apps/api/src/business/migration-preservation.integration.test.ts
      - name: Security and PostgreSQL authentication lifecycle
        env:
          AUTH_TEST_DATABASE_URL: postgres://identity_runtime:ci-auth-runtime@127.0.0.1:5432/enterprise_auth_test_ci
          AUTH_TEST_MIGRATION_DATABASE_URL: postgres://enterprise:ci-ephemeral-password@127.0.0.1:5432/enterprise_auth_test_ci
        run: pnpm verify:security
      - name: Tenant isolation
        env:
          AUTH_TEST_DATABASE_URL: postgres://identity_runtime:ci-auth-runtime@127.0.0.1:5432/enterprise_auth_test_ci
          AUTH_TEST_MIGRATION_DATABASE_URL: postgres://enterprise:ci-ephemeral-password@127.0.0.1:5432/enterprise_auth_test_ci
        run: pnpm verify:tenant-isolation
      - name: Live authentication browser and SMTP
        env:
          AUTH_ENABLED: "true"
          BETTER_AUTH_URL: http://127.0.0.1:4173
          BETTER_AUTH_SECRET: ci-only-auth-secret-for-an-ephemeral-run-${{ github.run_id }}
          DATABASE_URL: postgres://identity_runtime:ci-auth-runtime@127.0.0.1:5432/enterprise_auth_test_ci
          BUSINESS_DATABASE_URL: postgres://business_runtime:ci-auth-runtime@127.0.0.1:5432/enterprise_auth_test_ci
          AUTH_TEST_MIGRATION_DATABASE_URL: postgres://enterprise:ci-ephemeral-password@127.0.0.1:5432/enterprise_auth_test_ci
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          MAIL_FROM: test@example.test
          AUTH_TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: pnpm test:auth:e2e
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: ci-ephemeral-password
