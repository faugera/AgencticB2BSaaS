schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full Spec Kit Cycle"
  version: "1.1.0"
  author: "GitHub"
  description: "Runs the governed Spec Kit cycle through implementation and convergence with review gates"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The commands below are core Spec Kit commands. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs with
    # Codex and Claude, the integrations installed by this repository.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "codex"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-clarifications
    type: gate
    message: "Review the clarified specification before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  # Manual optional action: run speckit.checklist here only when feature risk
  # justifies a separate requirements-quality checklist. It is not an engine step.

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review task coverage and dependencies before analyzing the feature."
    options: [approve, reject]
    on_reject: abort

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: approve-implementation
    type: gate
    message: "Review the analysis and explicitly approve implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: verify-change
    type: gate
    message: "Run the project verify-change skill and pnpm docs:check against the PR base. Confirm results before final review."
    options: [approve, reject]
    on_reject: abort

  - id: review-convergence
    type: gate
    message: "Review verify-change results, required documentation-impact decisions, remaining tasks and verification limits before closing this cycle."
    options: [approve, reject]
    on_reject: abort
