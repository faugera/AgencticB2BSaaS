  - id: ui-components-state
    path: .specs/standards/ui-components-state.md
    summary: Réutilisation React, formulaires, navigation, accessibilité et langues.
    when_to_load: Interface utilisateur ou parcours navigateur.
  - id: workflow
    path: .specs/standards/workflow.md
